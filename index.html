<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>White Bronco - Digital Mysticism</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #0a0b0e; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none; 
        }

        #glass-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            pointer-events: none; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 20vh; /* Pushes the UI down into the lower third */
            box-sizing: border-box;
            background: radial-gradient(circle at center 75%, rgba(10,11,14,0.3) 0%, rgba(10,11,14,0) 50%);
        }

        .btn-container { 
            pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 20;
        }

        /* Enhanced Glassmorphism Button Style */
        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px; font-weight: 500; letter-spacing: 1px; padding: 16px 40px; cursor: pointer; 
            text-decoration: none; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            min-width: 200px;
        }
        
        .btn-glass:hover { 
            background: rgba(255, 255, 255, 0.12); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-glass:active {
            transform: translateY(1px);
        }

        .btn-glass:disabled { 
            background: rgba(255, 255, 255, 0.02); 
            color: rgba(255, 255, 255, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: not-allowed; 
            box-shadow: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transform: none;
        }

        #status-text { 
            color: rgba(255,255,255,0.4); font-family: monospace; font-size: 11px; letter-spacing: 2px; margin-top: 15px; 
            text-align: center; transition: color 0.3s ease;
        }

        #scroll-hint {
            position: absolute; bottom: 4vh; width: 100vw; text-align: center; 
            color: rgba(255,255,255,0.3); font-family: monospace; font-size: 10px; letter-spacing: 3px;
            animation: pulse 2.5s infinite; pointer-events: none;
        }
        
        @keyframes pulse { 0% { opacity: 0.1; } 50% { opacity: 0.7; } 100% { opacity: 0.1; } }

    </style>
</head>
<body>

    <canvas id="glass-canvas"></canvas>

    <div id="ui-layer">
        <div class="btn-container">
            <button class="btn-glass" id="start-btn" disabled>INITIALIZE SIGNAL</button>
            <a href="https://al-khabir.bandcamp.com/track/whitebronco" target="_blank" class="btn-glass">SECURE TRACK ↗</a>
        </div>
        <div id="status-text">SYNCING DATA...</div>
    </div>
    
    <div id="scroll-hint">SCROLL / DRAG TO ACCELERATE</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. AUDIO ENGINE SETUP ---
        const listener = new THREE.AudioListener();
        let audioContext;
        const stems = [];
        const bucketBase = 'https://pub-d1605939091d4017b8650442205e3d60.r2.dev';
        const stemFiles = [
            `${bucketBase}/stem_01.wav`,
            `${bucketBase}/stem_02.wav`,
            `${bucketBase}/stem_03.wav`,
            `${bucketBase}/stem_04.wav`,
            `${bucketBase}/stem_05.wav`
        ];
        
        let loadedCount = 0;
        const audioLoader = new THREE.AudioLoader();
        audioLoader.crossOrigin = "anonymous"; 

        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        stemFiles.forEach((file, index) => {
            audioLoader.load(file, (buffer) => {
                const stemAudio = new THREE.Audio(listener);
                stemAudio.setBuffer(buffer);
                stemAudio.setLoop(true);
                stemAudio.setVolume(1); 
                stems[index] = stemAudio;
                loadedCount++;
                
                if (loadedCount === stemFiles.length) {
                    startBtn.disabled = false;
                    startBtn.innerHTML = "INITIALIZE SIGNAL";
                    statusText.innerHTML = "SYSTEM READY";
                }
            }, undefined, function(err) {
                console.error("Audio Load Error:", err);
                statusText.innerHTML = "AUDIO CONNECTION FAILED";
                statusText.style.color = "#ff3333";
            });
        });

        let isPlaying = false;
        let baseTravelSpeed = 0.02; 
        
        startBtn.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = listener.context;
                camera.add(listener);
            }
            if (audioContext.state === 'suspended') audioContext.resume();
            
            if (!isPlaying) {
                stems.forEach(stem => { if(stem.buffer && !stem.isPlaying) stem.play(); });
                startBtn.innerHTML = "PAUSE SIGNAL";
                statusText.innerHTML = "EMISSION ACTIVE";
                statusText.style.color = "#88ccff"; 
                baseTravelSpeed = 0.15; 
                isPlaying = true;
            } else {
                stems.forEach(stem => { if(stem.isPlaying) stem.pause(); });
                startBtn.innerHTML = "INITIALIZE SIGNAL";
                statusText.innerHTML = "SYSTEM PAUSED";
                statusText.style.color = "rgba(255,255,255,0.4)";
                baseTravelSpeed = 0.02; 
                isPlaying = false;
            }
        });

        // --- 2. 3D VISUAL ENGINE & INFINITE SPACE ---
        const canvas = document.getElementById('glass-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0b0e);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        
        const cameraRig = new THREE.Group();
        scene.add(cameraRig);
        cameraRig.add(camera);

        function createFrostTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            const imgData = context.createImageData(256, 256);
            for(let i = 0; i < imgData.data.length; i += 4) {
                const noise = Math.random() * 255;
                imgData.data[i] = noise; imgData.data[i+1] = noise; imgData.data[i+2] = noise; imgData.data[i+3] = 255;
            }
            context.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xccddff,         
            metalness: 0.9,          
            roughness: 0.1,         
            roughnessMap: createFrostTexture(),  
            transmission: 0.8,       
            ior: 1.52,               
            thickness: 0.5,          
            transparent: true,      
            opacity: 0.9,            
            clearcoat: 1.0,          
            clearcoatRoughness: 0.05,
            side: THREE.DoubleSide   
        });

        const shards = [];
        let spawnZTarget = 0;
        const SPAWN_INTERVAL = -25; 

        function generateRandomPoints() {
            const points = [];
            const numPoints = 3 + Math.floor(Math.random() * 4); 
            const baseRadius = 15 + Math.random() * 25; 
            for(let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const r = baseRadius * (0.3 + Math.random() * 0.7); 
                points.push([Math.cos(angle) * r, Math.sin(angle) * r]);
            }
            return points;
        }

        function createShard(zDepth) {
            const points = generateRandomPoints();
            const shape = new THREE.Shape();
            shape.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                shape.lineTo(points[i][0], points[i][1]);
            }
            shape.lineTo(points[0][0], points[0][1]);

            const geometry = new THREE.ExtrudeGeometry(shape, { 
                depth: 0.2 + Math.random() * 0.6, 
                bevelEnabled: true, bevelSegments: 3, steps: 1, 
                bevelSize: 0.05, bevelThickness: 0.05 
            });
            
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);

            const mesh = new THREE.Mesh(geometry, glassMaterial);
            
            const spreadX = (Math.random() - 0.5) * 60;
            const spreadY = (Math.random() - 0.5) * 40;
            mesh.position.set(spreadX, spreadY, zDepth);
            
            mesh.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.005,
                rotSpeedY: (Math.random() - 0.5) * 0.005,
                rotSpeedZ: (Math.random() - 0.5) * 0.005,
                driftX: (Math.random() - 0.5) * 0.01,
                driftY: (Math.random() - 0.5) * 0.01,
            };

            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

            scene.add(mesh);
            shards.push(mesh);
        }

        function manageInfiniteSpace() {
            const drawDistance = cameraRig.position.z - 150; 
            while (spawnZTarget > drawDistance) {
                const count = 1 + Math.floor(Math.random() * 2);
                for(let i=0; i<count; i++) {
                    createShard(spawnZTarget + (Math.random() * 5));
                }
                spawnZTarget += SPAWN_INTERVAL;
            }

            for (let i = shards.length - 1; i >= 0; i--) {
                const s = shards[i];
                if (s.position.z > cameraRig.position.z + 20) {
                    scene.remove(s);
                    s.geometry.dispose(); 
                    shards.splice(i, 1);
                }
            }
        }

        manageInfiniteSpace();

        // --- 3. THE GLOWING ORBIT NAVIGATOR ---
        const orbitGroup = new THREE.Group();
        cameraRig.add(orbitGroup);

        function createVolumetricGlow() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; 
            canvas.height = 256;
            const context = canvas.getContext('2d');
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            
            const gradient = context.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            gradient.addColorStop(0.1, 'rgba(150, 220, 255, 0.8)');
            gradient.addColorStop(0.4, 'rgba(50, 100, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
            
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);
            
            return new THREE.CanvasTexture(canvas);
        }

        const glowMaterial = new THREE.SpriteMaterial({
            map: createVolumetricGlow(),
            color: 0xffffff,
            transparent: true,
            blending: THREE.AdditiveBlending, 
            depthWrite: false 
        });

        const glowSprite = new THREE.Sprite(glowMaterial);
        glowSprite.scale.set(12, 12, 1);
        orbitGroup.add(glowSprite);

        const orbLight = new THREE.PointLight(0xccddff, 8.0, 60);
        orbitGroup.add(orbLight);

        let orbTime = 0;

        // --- 4. TRAVELING STUDIO LIGHTING ---
        cameraRig.add(new THREE.AmbientLight(0xffffff, 0.4)); 

        const hemiLight = new THREE.HemisphereLight(0x2a3040, 0x0a0b0e, 1.0);
        cameraRig.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xeef5ff, 2.0); 
        dirLight.position.set(-10, 20, -15); 
        cameraRig.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x8899aa, 1.0);
        fillLight.position.set(15, -10, 5);
        cameraRig.add(fillLight);

        const mouseLight = new THREE.PointLight(0xffffff, 4.0, 40);
        mouseLight.position.set(0, 0, -5);
        cameraRig.add(mouseLight);

        // --- 5. INTERACTION ---
        let targetTravelSpeed = 0;
        let currentTravelSpeed = 0;
        const targetLightPos = new THREE.Vector3();

        function handlePointerMove(clientX, clientY) {
            const mx = (clientX / window.innerWidth) * 2 - 1;
            const my = -(clientY / window.innerHeight) * 2 + 1;
            
            targetLightPos.x = mx * 10;
            targetLightPos.y = my * 10;

            camera.rotation.y = mx * -0.1;
            camera.rotation.x = my * 0.1;
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));

        window.addEventListener('wheel', (e) => {
            targetTravelSpeed += e.deltaY * 0.005; 
            targetTravelSpeed = Math.max(-0.2, Math.min(targetTravelSpeed, 1.5)); 
        });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: false }); 
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                const deltaY = touchStartY - e.touches[0].clientY;
                targetTravelSpeed += deltaY * 0.008;
                targetTravelSpeed = Math.max(-0.2, Math.min(targetTravelSpeed, 1.5));
                touchStartY = e.touches[0].clientY; 
            }
        }, { passive: false });

        // --- 6. RESPONSIVENESS & ANIMATION LOOP ---
        function updateLayoutForDevice() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', updateLayoutForDevice);

        function animate() {
            requestAnimationFrame(animate);

            mouseLight.position.x += (targetLightPos.x - mouseLight.position.x) * 0.1;
            mouseLight.position.y += (targetLightPos.y - mouseLight.position.y) * 0.1;

            targetTravelSpeed *= 0.95; 
            currentTravelSpeed += ((baseTravelSpeed + targetTravelSpeed) - currentTravelSpeed) * 0.1;
            
            cameraRig.position.z -= currentTravelSpeed;

            orbTime += 0.01 + (currentTravelSpeed * 0.05);
            orbitGroup.position.x = Math.sin(orbTime * 1.5) * 6;
            orbitGroup.position.y = Math.cos(orbTime * 1.1) * 4;
            orbitGroup.position.z = Math.sin(orbTime * 0.8) * 10 - 25; 

            const pulse = 1 + Math.sin(orbTime * 5) * 0.1;
            glowSprite.scale.set(12 * pulse, 12 * pulse, 1);

            shards.forEach(shard => {
                shard.rotation.x += shard.userData.rotSpeedX;
                shard.rotation.y += shard.userData.rotSpeedY;
                shard.rotation.z += shard.userData.rotSpeedZ;
                
                shard.position.x += shard.userData.driftX;
                shard.position.y += shard.userData.driftY;

                const distZ = shard.position.z - cameraRig.position.z;
                if (distZ < 10 && distZ > -10) {
                    const repelStrength = Math.max(0, 1 - Math.abs(distZ) / 10);
                    shard.position.x += (shard.position.x > 0 ? 0.02 : -0.02) * repelStrength;
                    shard.position.y += (shard.position.y > 0 ? 0.02 : -0.02) * repelStrength;
                }
            });

            manageInfiniteSpace();

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

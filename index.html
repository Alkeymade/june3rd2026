<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>White Bronco - Digital Mysticism</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #0a0b0e; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #glass-canvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            pointer-events: none; 
            display: flex; flex-direction: column; justify-content: center; padding-left: 8vw;
            background: linear-gradient(90deg, rgba(10,11,14,0.7) 0%, rgba(10,11,14,0) 60%);
        }

        @media (max-width: 768px) {
            #ui-layer { justify-content: flex-start; padding-top: 10vh; padding-right: 8vw; background: linear-gradient(180deg, rgba(10,11,14,0.8) 0%, rgba(10,11,14,0) 50%); }
            h1 { font-size: 14vw; }
        }

        .micro-text {
            color: #666; font-family: monospace; font-size: 11px; letter-spacing: 3px;
            text-transform: uppercase; margin-bottom: 20px;
        }

        h1 {
            color: #e0e0e0; font-size: 7vw; font-weight: 500; letter-spacing: -0.04em;
            margin: 0 0 20px 0; line-height: 1.05; max-width: 800px;
        }

        .sub-text {
            color: #777; font-size: 15px; max-width: 400px; line-height: 1.6; margin-bottom: 40px;
            font-weight: 400;
        }

        .btn-container { pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 15px; margin-bottom: 15px; }

        .btn-primary {
            background: #e0e0e0; color: #000; border: none; border-radius: 30px;
            font-size: 13px; font-weight: 600; padding: 14px 28px; cursor: pointer; 
            transition: all 0.2s ease;
        }
        .btn-primary:hover { background: #fff; transform: scale(1.02); }
        .btn-primary:disabled { background: #333; color: #555; cursor: not-allowed; }
        
        .btn-ghost {
            background: transparent; color: #888; border: 1px solid #444; border-radius: 30px;
            font-size: 13px; font-weight: 600; padding: 14px 28px; cursor: pointer; 
            text-decoration: none; transition: all 0.2s ease;
        }
        .btn-ghost:hover { border-color: #888; color: #e0e0e0; }

        #status-text { color: #ff3333; font-family: monospace; font-size: 12px; letter-spacing: 1px; }

        #scroll-hint {
            position: absolute; bottom: 4vh; left: 8vw; color: #444; font-family: monospace; font-size: 10px; letter-spacing: 2px;
            animation: pulse 2s infinite; pointer-events: none;
        }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    </style>
</head>
<body>

    <canvas id="glass-canvas"></canvas>

    <div id="ui-layer">
        <div class="micro-text">DIGITAL MYSTICISM STUDIO</div>
        <h1>White<br>Bronco.</h1>
        <div class="sub-text">
            Author dispersion, transmission, and refraction in the browser. It does three things only: Listens, Compresses, Exhales. No feedback loops. No personalization.
        </div>
        <div class="btn-container">
            <button class="btn-primary" id="start-btn" disabled>INITIALIZE SIGNAL</button>
            <a href="https://al-khabir.bandcamp.com/track/whitebronco" target="_blank" class="btn-ghost">SECURE TRACK ↗</a>
        </div>
        <div id="status-text">SYNCING DATA...</div>
        <div id="scroll-hint">SCROLL / DRAG TO ACCELERATE</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. AUDIO ENGINE SETUP ---
        const listener = new THREE.AudioListener();
        let audioContext;
        const stems = [];
        const bucketBase = 'https://pub-d1605939091d4017b8650442205e3d60.r2.dev';
        const stemFiles = [
            `${bucketBase}/stem_01.wav`,
            `${bucketBase}/stem_02.wav`,
            `${bucketBase}/stem_03.wav`,
            `${bucketBase}/stem_04.wav`,
            `${bucketBase}/stem_05.wav`
        ];
        
        let loadedCount = 0;
        const audioLoader = new THREE.AudioLoader();
        audioLoader.crossOrigin = "anonymous"; 

        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        stemFiles.forEach((file, index) => {
            audioLoader.load(file, (buffer) => {
                const stemAudio = new THREE.Audio(listener);
                stemAudio.setBuffer(buffer);
                stemAudio.setLoop(true);
                stemAudio.setVolume(1); 
                stems[index] = stemAudio;
                loadedCount++;
                
                if (loadedCount === stemFiles.length) {
                    startBtn.disabled = false;
                    startBtn.innerHTML = "INITIALIZE SIGNAL";
                    statusText.innerHTML = "SYSTEM READY";
                    statusText.style.color = "#888";
                }
            }, undefined, function(err) {
                console.error("Audio Load Error:", err);
                statusText.innerHTML = "AUDIO CONNECTION FAILED";
            });
        });

        let isPlaying = false;
        let baseTravelSpeed = 0.02; 
        
        startBtn.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = listener.context;
                camera.add(listener);
            }
            if (audioContext.state === 'suspended') audioContext.resume();
            
            if (!isPlaying) {
                stems.forEach(stem => { if(stem.buffer && !stem.isPlaying) stem.play(); });
                startBtn.innerHTML = "PAUSE SIGNAL";
                statusText.innerHTML = "EMISSION ACTIVE";
                statusText.style.color = "#33ff33";
                baseTravelSpeed = 0.15; 
                isPlaying = true;
            } else {
                stems.forEach(stem => { if(stem.isPlaying) stem.pause(); });
                startBtn.innerHTML = "INITIALIZE SIGNAL";
                statusText.innerHTML = "SYSTEM PAUSED";
                statusText.style.color = "#888";
                baseTravelSpeed = 0.02; 
                isPlaying = false;
            }
        });

        // --- 2. 3D VISUAL ENGINE & INFINITE SPACE ---
        const canvas = document.getElementById('glass-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0b0e);
        // Fog removed to allow pure high-contrast light reflections in the deep space void
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        
        const cameraRig = new THREE.Group();
        scene.add(cameraRig);
        cameraRig.add(camera);

        // --- GLASS MATERIAL ---
        function createFrostTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const context = canvas.getContext('2d');
            const imgData = context.createImageData(256, 256);
            for(let i = 0; i < imgData.data.length; i += 4) {
                const noise = Math.random() * 255;
                imgData.data[i] = noise; imgData.data[i+1] = noise; imgData.data[i+2] = noise; imgData.data[i+3] = 255;
            }
            context.putImageData(imgData, 0, 0);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x0f1118,         
            metalness: 0.05,         
            roughness: 0.15,         
            roughnessMap: createFrostTexture(),  
            transmission: 1.0,       
            ior: 1.52,               
            thickness: 2.0,          
            transparent: true,      
            opacity: 1.0,            
            clearcoat: 1.0,          
            clearcoatRoughness: 0.05,
            side: THREE.DoubleSide   
        });

        // --- PROCEDURAL SHARD GENERATOR ---
        const shards = [];
        let spawnZTarget = 0;
        const SPAWN_INTERVAL = -15; 

        function generateRandomPoints() {
            const points = [];
            const numPoints = 4 + Math.floor(Math.random() * 5); 
            const baseRadius = 2 + Math.random() * 4;
            for(let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const r = baseRadius * (0.4 + Math.random() * 0.6); 
                points.push([Math.cos(angle) * r, Math.sin(angle) * r]);
            }
            return points;
        }

        function createShard(zDepth) {
            const points = generateRandomPoints();
            const shape = new THREE.Shape();
            shape.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                shape.lineTo(points[i][0], points[i][1]);
            }
            shape.lineTo(points[0][0], points[0][1]);

            const geometry = new THREE.ExtrudeGeometry(shape, { 
                depth: 0.6 + Math.random() * 1.5, 
                bevelEnabled: true, bevelSegments: 3, steps: 1, 
                bevelSize: 0.1, bevelThickness: 0.1 
            });
            
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);

            const mesh = new THREE.Mesh(geometry, glassMaterial);
            
            const spreadX = (Math.random() - 0.5) * 40;
            const spreadY = (Math.random() - 0.5) * 30;
            mesh.position.set(spreadX, spreadY, zDepth);
            
            mesh.userData = {
                rotSpeedX: (Math.random() - 0.5) * 0.01,
                rotSpeedY: (Math.random() - 0.5) * 0.01,
                rotSpeedZ: (Math.random() - 0.5) * 0.01,
                driftX: (Math.random() - 0.5) * 0.02,
                driftY: (Math.random() - 0.5) * 0.02,
            };

            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);

            scene.add(mesh);
            shards.push(mesh);
        }

        function manageInfiniteSpace() {
            // Extended draw distance to 120 so shards spawn deep in the darkness to avoid pop-in without fog
            const drawDistance = cameraRig.position.z - 120; 
            while (spawnZTarget > drawDistance) {
                const count = 2 + Math.floor(Math.random() * 3);
                for(let i=0; i<count; i++) {
                    createShard(spawnZTarget + (Math.random() * 5));
                }
                spawnZTarget += SPAWN_INTERVAL;
            }

            for (let i = shards.length - 1; i >= 0; i--) {
                const s = shards[i];
                if (s.position.z > cameraRig.position.z + 10) {
                    scene.remove(s);
                    s.geometry.dispose(); 
                    shards.splice(i, 1);
                }
            }
        }

        manageInfiniteSpace();

        // --- 3. TRAVELING STUDIO LIGHTING ---
        cameraRig.add(new THREE.AmbientLight(0xffffff, 0.2)); 

        const dirLight = new THREE.DirectionalLight(0xeef5ff, 2.0); 
        dirLight.position.set(-10, 20, -15); 
        cameraRig.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x8899aa, 1.0);
        fillLight.position.set(15, -10, 5);
        cameraRig.add(fillLight);

        const accentBlue = new THREE.PointLight(0x2288ff, 3, 60);
        accentBlue.position.set(20, 10, -10);
        cameraRig.add(accentBlue);
        
        const accentRed = new THREE.PointLight(0xff2255, 2.5, 60);
        accentRed.position.set(-20, -10, -10);
        cameraRig.add(accentRed);

        const mouseLight = new THREE.PointLight(0xffffff, 6.0, 40);
        mouseLight.position.set(0, 0, -5);
        cameraRig.add(mouseLight);

        // --- 4. INTERACTION ---
        let targetTravelSpeed = 0;
        let currentTravelSpeed = 0;
        const targetLightPos = new THREE.Vector3();

        function handlePointerMove(clientX, clientY) {
            const mx = (clientX / window.innerWidth) * 2 - 1;
            const my = -(clientY / window.innerHeight) * 2 + 1;
            
            targetLightPos.x = mx * 10;
            targetLightPos.y = my * 10;

            camera.rotation.y = mx * -0.1;
            camera.rotation.x = my * 0.1;
        }

        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));

        window.addEventListener('wheel', (e) => {
            targetTravelSpeed += e.deltaY * 0.005; 
            targetTravelSpeed = Math.max(-0.2, Math.min(targetTravelSpeed, 1.5)); 
        });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });
        
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                const deltaY = touchStartY - e.touches[0].clientY;
                targetTravelSpeed += deltaY * 0.001;
                targetTravelSpeed = Math.max(-0.2, Math.min(targetTravelSpeed, 1.0));
                touchStartY = e.touches[0].clientY; 
            }
        }, { passive: true });

        // --- 5. RESPONSIVENESS & ANIMATION LOOP ---
        function updateLayoutForDevice() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', updateLayoutForDevice);

        function animate() {
            requestAnimationFrame(animate);

            mouseLight.position.x += (targetLightPos.x - mouseLight.position.x) * 0.1;
            mouseLight.position.y += (targetLightPos.y - mouseLight.position.y) * 0.1;

            targetTravelSpeed *= 0.95; 
            currentTravelSpeed += ((baseTravelSpeed + targetTravelSpeed) - currentTravelSpeed) * 0.1;
            
            cameraRig.position.z -= currentTravelSpeed;

            shards.forEach(shard => {
                shard.rotation.x += shard.userData.rotSpeedX;
                shard.rotation.y += shard.userData.rotSpeedY;
                shard.rotation.z += shard.userData.rotSpeedZ;
                
                shard.position.x += shard.userData.driftX;
                shard.position.y += shard.userData.driftY;

                const distZ = shard.position.z - cameraRig.position.z;
                if (distZ < 10 && distZ > -10) {
                    const repelStrength = Math.max(0, 1 - Math.abs(distZ) / 10);
                    shard.position.x += (shard.position.x > 0 ? 0.05 : -0.05) * repelStrength;
                    shard.position.y += (shard.position.y > 0 ? 0.05 : -0.05) * repelStrength;
                }
            });

            manageInfiniteSpace();

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

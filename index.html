<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body, html { 
            margin: 0; padding: 0; background-color: #000; overflow: hidden; 
            touch-action: none; -webkit-user-select: none; user-select: none;
        }
        
        .grain {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 999; 
            opacity: 0.03; /* Reduced from 0.15 for a much cleaner look */
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            animation: grain-shift 0.2s steps(2) infinite;
        }
        @keyframes grain-shift {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-2%, -2%); }
            20% { transform: translate(2%, 2%); }
            30% { transform: translate(-2%, 2%); }
            40% { transform: translate(2%, -2%); }
            100% { transform: translate(0, 0); }
        }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
        }
        .btn-brutalist {
            background: transparent; color: #666; border: 1px solid #666;
            font-family: monospace; font-size: 16px; letter-spacing: 2px;
            padding: 15px 30px; cursor: pointer; text-transform: uppercase;
        }
        .btn-brutalist:active { background: #333; color: #fff; }

        #mobile-ui { display: none; }
        .d-pad {
            position: absolute; bottom: 30px; left: 30px; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .d-pad-row { display: flex; gap: 5px; }
        .ctrl-btn {
            width: 50px; height: 50px; background: rgba(20,20,20,0.5);
            border: 1px solid #444; color: #666; font-family: monospace;
            display: flex; justify-content: center; align-items: center; font-size: 18px; border-radius: 4px;
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.2); color: #fff; }

        #btn-action {
            position: absolute; bottom: 30px; right: 30px; z-index: 1000;
            width: 70px; height: 70px; border-color: #aa3333; color: #aa3333; border-radius: 50%;
        }
        #btn-action:active { background: rgba(170,51,51,0.3); color: #ff3333; }
        
        #interact-ui { 
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            color: #ff3333; font-family: monospace; font-size: 14px;
            letter-spacing: 2px; z-index: 1000; display: none; text-align: center;
            text-shadow: 0px 0px 5px rgba(255,0,0,0.5);
        }

        #loading-text {
            color: #444; font-family: monospace; margin-top: 20px; letter-spacing: 2px;
        }

        #terminal-drop {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 3000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-family: monospace; text-align: center;
        }
        .sys-log { color: #888; margin-bottom: 30px; letter-spacing: 1px; }
        .vault-link {
            color: #fff; text-decoration: none; border: 1px solid #fff;
            padding: 15px 40px; letter-spacing: 3px; font-weight: bold;
            transition: all 0.2s;
        }
        .vault-link:hover, .vault-link:active { background: #fff; color: #000; }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: rgba(255,255,255,0.3);
            border-radius: 50%; z-index: 500; pointer-events: none; display: none;
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.035);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 2, 0);
        scene.add(playerGroup);
        playerGroup.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. AUDIO ENGINE
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const encryptedSignal = new THREE.PositionalAudio(listener);
        let audioContext, oscillator, filter;

        const stems = [];
        const bucketBase = 'https://pub-d1605939091d4017b8650442205e3d60.r2.dev';
        const stemFiles = [
            `${bucketBase}/stem_01.wav`,
            `${bucketBase}/stem_02.wav`,
            `${bucketBase}/stem_03.wav`,
            `${bucketBase}/stem_04.wav`,
            `${bucketBase}/stem_05.wav`
        ];
        
        let loadedCount = 0;
        let currentStage = 0; 
        const maxStages = stemFiles.length;
        
        const audioLoader = new THREE.AudioLoader();
        audioLoader.crossOrigin = "anonymous"; 

        // CLEAN NATIVE LOAD LOOP
        stemFiles.forEach((file, index) => {
            audioLoader.load(file, (buffer) => {
                const stemAudio = new THREE.Audio(listener);
                stemAudio.setBuffer(buffer);
                stemAudio.setLoop(true);
                stemAudio.setVolume(0); // Native volume start
                
                stems[index] = stemAudio;
                loadedCount++;
                
                if (loadedCount === stemFiles.length) {
                    document.getElementById('loading-text').style.display = 'none';
                    document.getElementById('start-btn').style.display = 'block';
                }
            });
        });

        const blockCoordinates = [
            new THREE.Vector3(0, 4, -40),
            new THREE.Vector3(-10, 4, -80),
            new THREE.Vector3(10, 4, -130),
            new THREE.Vector3(-5, 4, -180),
            new THREE.Vector3(0, 4, -240)
        ];

        function initSystem() {
            audioContext = listener.context;
            if (audioContext.state === 'suspended') audioContext.resume();
            
            stems.forEach(stem => { if(stem.buffer) stem.play(); });

            oscillator = audioContext.createOscillator();
            oscillator.type = 'sawtooth';
            oscillator.frequency.value = 45; 
            filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 150;
            oscillator.connect(filter);
            encryptedSignal.setNodeSource(filter);
            encryptedSignal.setRefDistance(3); 
            encryptedSignal.setRolloffFactor(5); 
            encryptedSignal.setVolume(1.5);
            oscillator.start(0);

            dataBlock.position.copy(blockCoordinates[0]);
            blockLight.position.copy(blockCoordinates[0]);
            
            document.getElementById('crosshair').style.display = 'block';
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            initSystem();
            document.getElementById('start-screen').style.display = 'none';
            if (isMobile) document.getElementById('mobile-ui').style.display = 'block';
        });

        // 3. ARCHITECTURE (GLASS EFFECT APPLIED HERE)
        
        // Polished Obsidian Glass for Walls/Floor
        const wallMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x111111, 
            roughness: 0.2, 
            metalness: 0.8,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1
        });
        
        const gridHelper = new THREE.GridHelper(600, 300, 0x333333, 0x111111);
        gridHelper.position.y = -0.01; scene.add(gridHelper);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), wallMat);
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const pillarGeom = new THREE.BoxGeometry(6, 40, 6);
        for(let i = 0; i < 30; i++) { 
            const zPos = -10 - (i * 15); 
            const left = new THREE.Mesh(pillarGeom, wallMat); left.position.set(-14, 20, zPos); scene.add(left);
            const right = new THREE.Mesh(pillarGeom, wallMat); right.position.set(14, 20, zPos); scene.add(right);
        }

        const starGeom = new THREE.BufferGeometry();
        const starPos = new Float32Array(2000 * 3);
        for(let i = 0; i < 6000; i += 3) {
            starPos[i] = (Math.random() - 0.5) * 600; 
            starPos[i+1] = Math.random() * 200 + 40;  
            starPos[i+2] = (Math.random() - 0.5) * 600; 
        }
        starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeom, new THREE.PointsMaterial({ color: 0x888888, size: 0.7, fog: false })));

        // Emissive Obsidian Glass for the Data Blocks
        const blockMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x050505, 
            emissive: 0x220000, 
            roughness: 0.1, 
            metalness: 0.9,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05
        });
        
        const dataBlock = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 3), blockMat);
        scene.add(dataBlock);
        dataBlock.add(encryptedSignal);
        const blockLight = new THREE.PointLight(0xff0000, 0, 20);
        scene.add(blockLight);

        const moonLight = new THREE.DirectionalLight(0x445566, 1.2); 
        moonLight.position.set(-50, 100, 20); scene.add(moonLight);
        scene.add(new THREE.AmbientLight(0x111111));

        const playerLight = new THREE.PointLight(0xffffff, 1.5, 40);
        scene.add(playerLight);

        // 4. UNIVERSAL CONTROLS
        const moveState = { forward: false, backward: false, left: false, right: false, interact: false };
        
        if (isMobile) {
            const bindBtn = (id, key) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[key] = true; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); moveState[key] = false; });
            };
            bindBtn('btn-w', 'forward'); bindBtn('btn-s', 'backward');
            bindBtn('btn-a', 'left'); bindBtn('btn-d', 'right');
            bindBtn('btn-action', 'interact');
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = true;
            if (e.code === 'KeyE' || e.code === 'Space') moveState.interact = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') moveState.forward = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') moveState.backward = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveState.left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveState.right = false;
            if (e.code === 'KeyE' || e.code === 'Space') moveState.interact = false;
        });

        let isDragging = false, previousX = 0, previousY = 0, lon = -90, lat = 0;
        
        document.addEventListener('pointerdown', (e) => {
            if(e.target.className === 'ctrl-btn' || e.target.id === 'btn-action' || e.target.tagName === 'BUTTON') return;
            isDragging = true; 
            previousX = e.clientX; 
            previousY = e.clientY;
        });
        
        document.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousX;
            const deltaY = e.clientY - previousY;
            lon -= deltaX * 0.2; 
            lat -= deltaY * 0.2;
            lat = Math.max(-85, Math.min(85, lat)); 
            previousX = e.clientX; 
            previousY = e.clientY;
        });
        
        document.addEventListener('pointerup', () => isDragging = false);
        document.addEventListener('pointercancel', () => isDragging = false);

        const clock = new THREE.Clock();
        let walkTime = 0; 
        let blockDecrypting = false;

        // 5. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            let phi = THREE.MathUtils.degToRad(90 - lat);
            let theta = THREE.MathUtils.degToRad(lon);
            
            let cam
